<!DOCTYPE html>
<html>
<head>
    <title>Robot Arm - WebSocket Test Client</title>
    <style>
        body { font-family: sans-serif; padding: 1em; }
        #messages { white-space: pre-wrap; background-color: #eee; border: 1px solid #ccc; padding: 1em; margin-top: 1em; }
        .controls button { margin-right: 10px; padding: 8px 12px; }
    </style>
    <!-- Include SockJS and STOMP clients -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>Robot Arm Sequence Tester</h1>
<div class="controls">
    <button id="connect" onclick="connect();">Connect</button>
    <button id="disconnect" disabled onclick="disconnect();">Disconnect</button>
</div>
<hr>
<div class="controls">
    <button id="getAll" disabled onclick="getAllSequences();">Get All Sequences</button>
    <button id="create" disabled onclick="createSequence();">Create New Sequence</button>
</div>

<h3>Received Messages on /topic/sequences:</h3>
<div id="messages"></div>

<script type="text/javascript">
    let stompClient = null;
    const messagesDiv = document.getElementById('messages');

    function setConnected(connected) {
        document.getElementById('connect').disabled = connected;
        document.getElementById('disconnect').disabled = !connected;
        document.getElementById('getAll').disabled = !connected;
        document.getElementById('create').disabled = !connected;
        if (!connected) {
            messagesDiv.innerHTML = '';
        }
    }

    function connect() {
        // Use the endpoint you defined in WebSocketConfig
        const socket = new SockJS('/ws-robot-arm');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            console.log('Connected: ' + frame);

            // Subscribe to the topic where the server sends updates
            stompClient.subscribe('/topic/sequences', function (message) {
                // Display the received list of sequences
                const sequences = JSON.parse(message.body);
                messagesDiv.innerHTML = JSON.stringify(sequences, null, 2);
            });
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        setConnected(false);
        console.log("Disconnected");
    }

    function getAllSequences() {
        // Send a message to the destination handled by @MessageMapping("/sequences.getAll")
        stompClient.send("/app/sequences.getAll", {}, {});
        console.log("Sent request to get all sequences.");
    }

    function createSequence() {
        // Create a sample sequence DTO to send to the backend
        const newSequence = {
            name: "Test Sequence " + new Date().toLocaleTimeString(),
            steps: [
                {
                    name: "Start Position",
                    pose: { x: 10, y: 20, z: 30, roll: 0, pitch: 90, yaw: 0 },
                    interpolation: "LINEAR",
                    speed: 100
                }
            ],
            settings: {
                loopSequence: false
            }
        };
        // Send the DTO as a JSON string to the @MessageMapping("/sequences.create")
        stompClient.send("/app/sequences.create", {}, JSON.stringify(newSequence));
        console.log("Sent request to create a new sequence.");
    }
</script>
</body>
</html>
